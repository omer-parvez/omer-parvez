name: Contribution snake

# Draws the contribution snake and pushes the SVGs to the "output" branch, which README.md shows.
on:
  schedule:
    - cron: "0 0 * * *" # daily, so new contributions appear
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Same RGB colours as the README banners: empty cell, then 4 contribution levels.
          outputs: |
            dist/github-snake.svg?color_snake=#8a2be2&color_dots=#ebedf0,#40e0d0,#4169e1,#ff8c00,#ff0080
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff4ecd&color_dots=#161b22,#40e0d0,#4169e1,#ff8c00,#ff0080

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
