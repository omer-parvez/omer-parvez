name: Contribution snake and 3D graph

# Draws the contribution snake and the 3D contribution graph, and pushes the SVGs to the "output" branch, which README.md shows.
on:
  schedule:
    - cron: "0 0 * * *" # daily, so new contributions appear
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Same RGB colours as the README banners: empty cell, then 4 contribution levels.
          outputs: |
            dist/github-snake.svg?color_snake=#8a2be2&color_dots=#ebedf0,#40e0d0,#4169e1,#ff8c00,#ff0080
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff4ecd&color_dots=#161b22,#40e0d0,#4169e1,#ff8c00,#ff0080

      # Writes several themes to ./profile-3d-contrib; the README uses the rainbow one.
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # snk runs in Docker, so dist/ is owned by root and not writable here; collect everything in site/.
      - run: |
          mkdir site
          cp dist/*.svg profile-3d-contrib/profile-night-rainbow.svg site/

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
